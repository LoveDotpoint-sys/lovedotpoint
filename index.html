<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Dot Point POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reports.css"><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginView" class="login"><div class="loginlogo"><img src="https://wlediyikwdcmrkndgcfh.supabase.co/functions/v1/pos-logo"></div><h1>Love Dot Point POS</h1><div class="sub">Pure Veg · Dine-In Table Billing</div><div class="formrow"><input id="loginId" class="field" placeholder="Login ID"></div><div class="formrow" style="position:relative"><input id="loginPw" class="field" type="password" placeholder="Password" style="padding-right:48px"><button type="button" aria-label="Show or hide password" onclick="togglePassword('loginPw',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px">👁</button></div><div style="text-align:right;margin:-4px 0 12px"><button type="button" onclick="forgotOwnerPassword()" style="border:0;background:transparent;color:#6b4423;cursor:pointer;font-weight:700">Forgot / Reset Owner Password?</button></div><button class="btn" style="width:100%" onclick="login()">Login</button></div>
<div id="appView" class="hidden"><div class="top"><div class="topin"><div class="brand"><img src="https://wlediyikwdcmrkndgcfh.supabase.co/functions/v1/pos-logo"><div><b>Love Dot Point Restaurant</b><small>Owner & Waiter POS · No GST</small></div></div><div class="userbox"><span id="who" class="pill"></span><button class="btn ghost" onclick="logout()">Logout</button></div></div></div><div class="wrap"><div class="shell"><aside class="side" id="side"></aside><main class="main" id="main"></main></div></div><div class="mobilebar" id="mobilebar"></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script><script>
function togglePassword(id,btn){const p=document.getElementById(id);if(!p)return;p.type=p.type==='password'?'text':'password';if(btn)btn.textContent=p.type==='password'?'👁':'🙈'}
async function forgotOwnerPassword(){const email='jpithva01@gmail.com';const redirectTo='https://lovedotpoint-sys.github.io/lovedotpoint/';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error)return toast(error.message);toast('Password reset link owner email par send kiya gaya.');}
function showRecoveryModal(){document.getElementById('modalbox').innerHTML=`<h2>Set New Owner Password</h2><div class="note" style="margin-bottom:12px">Recovery link verified. Ab naya password set kijiye.</div><div class="formrow" style="position:relative"><input id="recoveryPw" class="field" type="password" placeholder="New Password" style="padding-right:48px"><button type="button" aria-label="Show or hide password" onclick="togglePassword('recoveryPw',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px">👁</button></div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRecoveryPassword()">Save New Password</button></div>`;document.getElementById('modal').classList.remove('hidden')}
async function saveRecoveryPassword(){const p=document.getElementById('recoveryPw').value;if(!p||p.length<8)return toast('Password minimum 8 characters hona chahiye');const {error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message);toast('Owner password successfully updated');setTimeout(()=>location.href='https://lovedotpoint-sys.github.io/lovedotpoint/',900)}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(showRecoveryModal,100)});
</script></body></html>
