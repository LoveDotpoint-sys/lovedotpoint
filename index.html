<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Dot Point Restaurant POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reports.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="final.css"><link rel="stylesheet" href="dashboard-v2.css"><link rel="stylesheet" href="floor-v3.css"><link rel="stylesheet" href="waiter-upgrades.css"><link rel="stylesheet" href="shared-floor.css"><link rel="stylesheet" href="smart-ops.css"><link rel="stylesheet" href="restaurant-control-v2.css"><link rel="stylesheet" href="joint-tables.css"><link rel="stylesheet" href="assign-table-ui.css"><link rel="stylesheet" href="quantity-input.css"><link rel="stylesheet" href="pos-safety-v3.css"><link rel="stylesheet" href="inline-note-v4.css"><link rel="stylesheet" href="thermal-print.css"><link rel="stylesheet" href="mobile-print-v1.css"><style>@media(max-width:700px){.top .brand>div{display:block!important;min-width:0!important}.top .brand b{display:none!important}.top .brand small{display:block!important;font-size:10px!important;line-height:1.15!important;white-space:nowrap!important}.top .brand{min-width:0!important;gap:5px!important}.top .brand img{width:40px!important;height:40px!important;object-fit:contain!important}.top .topin{gap:6px!important}.top .userbox{margin-left:auto!important;min-width:0!important;gap:5px!important}.top .userbox .pill{max-width:88px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:10px!important}.top .userbox .btn{padding-left:8px!important;padding-right:8px!important}}</style></head><body>
<div id="loginView" class="login"><div class="loginlogo"><img src="https://wlediyikwdcmrkndgcfh.supabase.co/functions/v1/pos-logo"></div><h1>Love Dot Point Restaurant</h1><div class="sub">Pure Veg · Dine-In Restaurant POS</div><div class="note" style="text-align:center;margin:8px 0 18px">Secure Owner & Waiter Login</div><div class="formrow"><input id="loginId" class="field" placeholder="Login ID" autocomplete="username"></div><div class="formrow" style="position:relative"><input id="loginPw" class="field" type="password" placeholder="Password" autocomplete="current-password" style="padding-right:48px"><button type="button" aria-label="Show or hide password" onclick="togglePassword('loginPw',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px">👁</button></div><div style="text-align:right;margin:-4px 0 12px"><button type="button" onclick="forgotOwnerPassword()" style="border:0;background:transparent;color:#6b4423;cursor:pointer;font-weight:700">Forgot Owner Password?</button></div><button class="btn" style="width:100%" onclick="login()">Login to POS</button><div class="note" style="text-align:center;margin-top:14px">Authorized restaurant staff only</div></div>
<div id="appView" class="hidden"><div class="top"><div class="topin"><div class="brand"><img src="https://wlediyikwdcmrkndgcfh.supabase.co/functions/v1/pos-logo"><div><b>Love Dot Point Restaurant</b><small>Pure Veg · Dine-In POS</small></div></div><div class="userbox"><span id="who" class="pill"></span><button class="btn ghost" onclick="logout()">Logout</button></div></div></div><div class="wrap"><div class="shell"><aside class="side" id="side"></aside><main class="main" id="main"></main></div></div><div class="mobilebar" id="mobilebar"></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script><script src="app5.js"></script><script src="app6.js"></script><script src="dashboard-v2.js"></script><script src="release-table.js"></script><script src="floor-v3.js"></script><script src="waiter-upgrades.js"></script><script src="shared-floor.js"></script><script src="smart-ops.js"></script><script src="restaurant-control-v2.js"></script><script src="joint-tables.js"></script><script src="assign-table-ui.js"></script><script src="quantity-input.js"></script><script src="pos-safety-v3.js"></script><script src="remove-repeat.js"></script><script src="inline-note-v4.js"></script><script src="mobile-print-v1.js"></script><script src="waiter-reliability-v1.js"></script><script>
function togglePassword(id,btn){const p=document.getElementById(id);if(!p)return;p.type=p.type==='password'?'text':'password';if(btn)btn.textContent=p.type==='password'?'👁':'🙈'}
async function forgotOwnerPassword(){const email='jpithva01@gmail.com';const redirectTo='https://lovedotpoint-sys.github.io/lovedotpoint/';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error)return toast(error.message);toast('Password reset link owner email par send kiya gaya.');}
function showRecoveryModal(){document.getElementById('modalbox').innerHTML=`<h2>Set New Owner Password</h2><div class="note" style="margin-bottom:12px">Recovery link verified. Naya secure password set kijiye.</div><div class="formrow" style="position:relative"><input id="recoveryPw" class="field" type="password" placeholder="New Password" style="padding-right:48px"><button type="button" aria-label="Show or hide password" onclick="togglePassword('recoveryPw',this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:20px">👁</button></div><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRecoveryPassword()">Save New Password</button></div>`;document.getElementById('modal').classList.remove('hidden')}
async function saveRecoveryPassword(){const p=document.getElementById('recoveryPw').value;if(!p||p.length<8)return toast('Password minimum 8 characters hona chahiye');const {error}=await sb.auth.updateUser({password:p});if(error)return toast(error.message);toast('Owner password successfully updated');setTimeout(()=>location.href='https://lovedotpoint-sys.github.io/lovedotpoint/',900)}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(showRecoveryModal,100)});
</script></body></html>
